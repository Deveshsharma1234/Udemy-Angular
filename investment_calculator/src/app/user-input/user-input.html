<form (ngSubmit)="onSubmit()">

    <div class="input-group">
        <div>
            <label for="intialInvestment">Initial Investment</label>
            <input title="initalInvestment" type="text" [name]="initalInvestment" [placeholder]="initalInvestment">

        </div>
        <div>
            <label for="AnnualInvestment">Annual Investment</label>
            <input title="AnnualInvestment" type="text" [name]="AnnualInvestment" [placeholder]="AnnualInvestment">

        </div>
        <div>
            <label for="expectedReturn">Expected Return </label>
            <input title="expectedReturn" type="text" [name]="expectedReturn" [placeholder]="expectedReturn">


        </div>
        <div>
            <label for="duration">Duration</label>
            <input title="duration" type="text" [name]="duration" [placeholder]="duration">
        </div>

    </div>

    <button type="button">Calculate</button>

</form>
